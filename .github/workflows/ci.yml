name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # GitHub runners have no GPU: WebGPU and WebGL2 run on SwiftShader with
      # --enable-unsafe-webgpu (flags live in playwright.config.ts).
      - name: Pixel-quality and editor tests (WebGPU + WebGL2)
        run: npx playwright test --project=render

      # Re-renders every layout conformance case in Chromium: the engine must match it, and the stored
      # fixtures (which `npm test` compares against) must still be what this Chromium renders.
      - name: Layout conformance against live Chromium
        run: npm run test:conformance

      - name: Benchmarks (pan/zoom, 10k-node document updates; both backends)
        run: npx playwright test --project=bench

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
